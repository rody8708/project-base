ServerName foundation.localhost
ServerTokens Prod
ServerSignature Off
PidFile /tmp/apache/apache.pid
<VirtualHost *:8443>
    ServerName foundation.localhost
    DocumentRoot /app/public
    SetEnvIfNoCase Authorization "^(.*)$" HTTP_AUTHORIZATION=$1
    SSLEngine on
    SSLCertificateFile /state/cert.pem
    SSLCertificateKeyFile /state/key.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer
    <Directory /app/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    # Do not record URLs/query strings, Authorization headers, or request bodies.
    LogFormat "%h %m %>s %D" safe
    CustomLog /proc/self/fd/1 safe
    ErrorLog /proc/self/fd/2
</VirtualHost>

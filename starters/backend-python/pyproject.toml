[project]
name = "foundation-backend-python"
version = "1.2.0.dev1"
description = "Framework-assisted Python API foundation with explicit architecture boundaries"
requires-python = ">=3.13.15,<3.15"
license = "MPL-2.0"
dependencies = [
  "fastapi==0.141.1",
  "python-dotenv==1.2.3",
  "sqlalchemy==2.0.52",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]==3.2.9"]
mysql = ["pymysql[rsa]==1.1.2"]

[dependency-groups]
dev = [
  "cryptography==50.0.1",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_base_api"]
